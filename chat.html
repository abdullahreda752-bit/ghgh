<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARES · مساعد المريخ الذكي | دليل النجاة بين الكواكب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Orbitron:wght@500;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#04030a;--ink:#f2ecff;--mute:#a597b8;--rust:#ff6a3d;--gold:#ffb86b;--ice:#6fe3ff;--vio:#8b5cf6;--line:#ffffff1c;--glass:#0f0b1bcc;--f:"Tajawal",system-ui,sans-serif;--h:"Orbitron","Tajawal",sans-serif;--m:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.7;overflow:hidden;display:flex;flex-direction:column}
.nebula{position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 20% 30%,#5b21b655,transparent 70%),radial-gradient(35% 40% at 80% 20%,#ff6a3d33,transparent 70%),radial-gradient(45% 40% at 60% 85%,#0ea5e933,transparent 70%)}
button{font:inherit;color:var(--ink);background:#ffffff0d;border:1px solid var(--line);border-radius:999px;cursor:pointer;padding:7px 15px;font-size:13px;display:inline-flex;align-items:center;gap:8px;transition:.25s;backdrop-filter:blur(8px)}
button:hover{border-color:var(--gold);color:var(--gold)}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;background:linear-gradient(#04030aee,#04030a88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--h);font-weight:800;font-size:15px;letter-spacing:.5px}
.pl{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold),var(--rust) 60%,#7a2c14);box-shadow:0 0 14px #ff6a3d99}
.brand small{display:block;font-family:var(--f);font-weight:400;color:var(--mute);font-size:11px;letter-spacing:0}
.sp{flex:1}
body.embed header .back{display:none}
#log{flex:1;overflow-y:auto;padding:22px 16px 10px;scroll-behavior:smooth}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:12px 16px;border-radius:18px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);overflow-wrap:anywhere;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,#8b5cf633,#ff6a3d2e);border-color:#ffb86b55;border-end-start-radius:4px}
.msg.bot{align-self:flex-end;border-end-end-radius:4px;border-color:#6fe3ff33}
.msg .who{font-family:var(--h);font-size:10px;letter-spacing:1.5px;color:var(--ice);margin-bottom:4px}
.msg.user .who{color:var(--gold)}
.msg p{margin:.3em 0}.msg ul,.msg ol{padding-inline-start:22px;margin:.4em 0}
.msg a{color:var(--gold)}
.msg pre{direction:ltr;text-align:left;background:#000a;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;font:13px var(--m)}
.msg code{font-family:var(--m);font-size:.9em;color:var(--gold)}.msg pre code{color:var(--ink)}
.msg table{border-collapse:collapse;display:block;overflow-x:auto}.msg td,.msg th{border:1px solid var(--line);padding:5px 10px}
.msg img.card{display:block;width:100%;max-width:420px;border-radius:12px;margin:8px 0;border:1px solid var(--line)}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--ice);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}
#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{white-space:nowrap;flex:none}
form{display:flex;gap:10px;align-items:flex-end;max-width:820px;width:100%;margin:0 auto;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px))}
textarea{flex:1;resize:none;max-height:140px;font:inherit;color:var(--ink);background:#0f0b1bcc;border:1px solid var(--line);border-radius:22px;padding:11px 18px;outline:none;transition:.25s}
textarea:focus{border-color:var(--ice);box-shadow:0 0 0 3px #6fe3ff22}
#send{width:46px;height:46px;padding:0;justify-content:center;border:0;background:linear-gradient(135deg,var(--rust),var(--gold));color:#1a0a04;font-weight:800;font-size:18px;flex:none}
#send:hover{color:#1a0a04;filter:brightness(1.1)}#send:disabled{opacity:.5}
dialog{background:#120d22;color:var(--ink);border:1px solid var(--line);border-radius:20px;max-width:440px;width:90%;font-family:var(--f)}
dialog::backdrop{background:#000a;backdrop-filter:blur(4px)}
dialog input,dialog select{width:100%;font:inherit;color:var(--ink);background:#0008;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0 12px}
dialog label{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;justify-content:flex-end}
.note{font-size:12px;color:var(--mute);margin:0 0 12px}
</style>
</head>
<body>
<div class="nebula"></div>
<header>
  <div class="brand"><span class="pl"></span><div>ARES · AI<small>مساعد المريخ الذكي</small></div></div>
  <div class="sp"></div>
  <button id="persona" title="شخصية المساعد">🎭 <span id="pname">ARES</span></button>
  <button id="clear" title="محادثة جديدة">🗑 جديد</button>
  <button id="save" title="حفظ المحادثة">⬇ حفظ</button>
  <button id="cfg" title="إعدادات" hidden>⚙</button>
  <a class="back" href="index.html" style="text-decoration:none"><button type="button">← الموقع</button></a>
</header>

<div id="log"><div class="wrap" id="wrap"></div></div>
<div id="chips">
  <button data-q="ما هي أهم الأخطار اللي بتواجه البشر على سطح المريخ؟">☢ أخطار المريخ</button>
  <button data-q="إزاي ممكن نعمل مياه وأكسجين على المريخ؟">💧 مياه وأكسجين</button>
  <button data-q="قارنلي بين مهمات Perseverance و Curiosity">🛰 المركبات</button>
  <button data-q="إزاي نقدر نحول المريخ لكوكب صالح للحياة (Terraforming)؟">🌱 تحويل المريخ</button>
  <button data-tool="apod">🔭 صورة ناسا اليوم</button>
  <button data-tool="epic">🌍 الأرض من الفضاء</button>
  <button data-tool="neo">☄ كويكبات قريبة</button>
  <button data-tool="quake">🌋 زلازل الأرض</button>
</div>
<form id="f" autocomplete="off">
  <textarea id="in" rows="1" placeholder="اسأل عن المريخ…"></textarea>
  <button id="send" type="submit" aria-label="إرسال">➤</button>
</form>

<dialog id="dlgP"><h3 style="margin-top:0">اختار الشخصية</h3>
  <select id="pSel">
    <option value="ares">ARES — مساعد صريح ومباشر</option>
    <option value="cmd">القائد فانس — قائد قاعدة المريخ</option>
    <option value="sci">المهندس — هندسة كوكبية وفيزياء فلكية</option>
  </select>
  <div class="row"><button type="button" id="pOk">تم</button></div>
</dialog>

<dialog id="dlgK"><h3 style="margin-top:0">مفتاح Gemini</h3>
  <p class="note">السيرفر الوسيط مش متفعّل على الاستضافة دي، فحط مفتاحك الشخصي من Google AI Studio. بيتخزن في متصفحك بس.</p>
  <label for="kIn">API Key</label><input id="kIn" type="password" placeholder="AIza..." autocomplete="off">
  <label for="mSel">الموديل</label>
  <select id="mSel">
    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (سريع)</option>
    <option value="gemini-3.8-flash">Gemini 3.8 Flash (أذكى)</option>
    <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
  </select>
  <div class="row"><a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" style="color:var(--gold);align-self:center;font-size:13px;margin-inline-end:auto">احصل على مفتاح مجاني</a><button type="button" id="kOk">حفظ</button></div>
</dialog>

<script>
/* ===== الإعدادات (غيّرها لو حبيت) ===== */
/* الخيار 1 (الأسهل): حط مفتاحك هنا بين العلامتين وخلاص — اقرأ README عن تقييد المفتاح بدومين موقعك */
/* الخيار 2 (الأأمن): حط رابط Cloudflare Worker في proxy بدل المفتاح */
const CFG={key:'AQ.Ab8RN6KZbAAroEc1Z3ioilGNmI4E7nD1sN6edKHLmDgUL2H3yw',proxy:'/.netlify/functions/chat',model:'gemini-3.5-flash-lite'};

const PERSONAS={
 ares:{n:'ARES',p:'أنت ARES، مساعد ذكاء اصطناعي يعيش داخل موقع "دليل النجاة بين الكواكب" المتخصص في المريخ. تجاوب بالعربية (يفضّل بلهجة مصرية مبسطة أو فصحى سهلة حسب لغة السائل) وبشكل مباشر ودقيق وجذاب، بدون محاضرات. تستخدم أرقام وحقائق علمية حقيقية من ناسا، وتقول بصراحة لو مش متأكد. لو اتعطتلك بيانات حية (NASA/USGS/JPL) استخدمها في إجابتك. خلي الإجابات مختصرة ومنظمة بماركداون.'},
 cmd:{n:'القائد فانس',p:'أنت القائد فانس، قائد قاعدة بشرية على المريخ. تتكلم بحسم وبأسلوب عسكري واقعي عن البقاء والخطط والمخاطر، بالعربية وبدون حشو، مع الحفاظ على الدقة العلمية.'},
 sci:{n:'المهندس',p:'أنت مهندس كواكب وفيزيائي فلكي. تشرح بعمق مع معادلات وأرقام ووحدات عن الغلاف الجوي والإشعاع والطاقة والتحويل الكوكبي، بالعربية الواضحة، وتفرّق بين الحقائق والتقديرات.'}
};
const S={persona:localStorage.getItem('ares_persona')||'ares',key:localStorage.getItem('ares_key')||'',model:localStorage.getItem('ares_model')||CFG.model,hist:[],proxyOk:null,busy:false};
const $=s=>document.querySelector(s),wrap=$('#wrap'),log=$('#log'),inp=$('#in');
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');

/* ===== واجهة ===== */
function add(role,html){const d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div class="who">'+(role==='user'?'أنت':PERSONAS[S.persona].n)+'</div><div class="b">'+html+'</div>';wrap.appendChild(d);log.scrollTop=log.scrollHeight;return d.querySelector('.b')}
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(t){return marked.parse(esc(t).replace(/&gt;/g,'>'),{breaks:true})}
function welcome(){wrap.innerHTML='';S.hist=[];add('bot',md('أهلاً بيك في **ARES** 🚀\n\nأنا مساعدك الذكي لكل حاجة عن المريخ: الهبوط، البقاء، المياه، الإشعاع، ومهمات ناسا. اسأل أي سؤال، أو جرّب الأزرار تحت عشان تجيب **بيانات حية من ناسا**.'))}
$('#pname').textContent=PERSONAS[S.persona].n;$('#pSel').value=S.persona;
$('#persona').onclick=()=>$('#dlgP').showModal();
$('#pOk').onclick=()=>{S.persona=$('#pSel').value;localStorage.setItem('ares_persona',S.persona);$('#pname').textContent=PERSONAS[S.persona].n;$('#dlgP').close()};
$('#clear').onclick=welcome;
$('#save').onclick=()=>{const t='# محادثة ARES\n\n'+S.hist.map(m=>(m.role==='user'?'**أنت:** ':'**ARES:** ')+m.parts[0].text).join('\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/markdown'}));a.download='ares-chat.md';a.click()};
$('#cfg').onclick=()=>{$('#kIn').value=S.key;$('#mSel').value=S.model;$('#dlgK').showModal()};
$('#kOk').onclick=()=>{S.key=$('#kIn').value.trim();S.model=$('#mSel').value;localStorage.setItem('ares_key',S.key);localStorage.setItem('ares_model',S.model);$('#dlgK').close()};
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px'});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#f').requestSubmit()}});
$('#f').onsubmit=e=>{e.preventDefault();const t=inp.value.trim();if(t)ask(t);inp.value='';inp.style.height='auto'};
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.q)ask(b.dataset.q);else tool(b.dataset.tool)};

/* ===== Gemini (عن طريق السيرفر الوسيط أو مفتاح المستخدم) ===== */
async function gemini(body){
  if(CFG.key){const vx=CFG.key.indexOf('AQ.')===0;/* مفاتيح AQ. هي مفاتيح Vertex AI وليست AI Studio */
    const u=vx?'https://aiplatform.googleapis.com/v1/publishers/google/models/'+CFG.model+':generateContent':'https://generativelanguage.googleapis.com/v1beta/models/'+CFG.model+':generateContent';
    return fetch(u,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':CFG.key},body:JSON.stringify({contents:body.contents,systemInstruction:body.systemInstruction,generationConfig:body.generationConfig})})}
  if(S.proxyOk!==false){
    try{const r=await fetch(CFG.proxy,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.status!==404&&r.status!==405){S.proxyOk=true;$('#cfg').hidden=true;return r}
    }catch(_){}
    S.proxyOk=false;
  }
  $('#cfg').hidden=false;
  if(!S.key){$('#cfg').click();throw new Error('محتاج مفتاح Gemini عشان أشتغل. حطه من زر ⚙ فوق.')}
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+S.model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body:JSON.stringify(body)});
}
async function ask(text,grounding){
  if(S.busy)return;S.busy=true;$('#send').disabled=true;
  add('user',esc(text).replace(/\n/g,'<br>'));
  S.hist.push({role:'user',parts:[{text}]});
  const out=add('bot','<span class="dots"><span></span><span></span><span></span></span>');
  let sys=PERSONAS[S.persona].p;if(grounding)sys+='\n\nبيانات حية مجلوبة الآن (استخدمها):\n'+grounding;
  try{
    const r=await gemini({model:CFG.key?CFG.model:S.model,systemInstruction:{parts:[{text:sys}]},contents:S.hist.slice(-20),generationConfig:{temperature:.8}});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error&&j.error.message||'حصل خطأ ('+r.status+')');
    const ans=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||'').join('')||'مفيش رد. جرّب تسأل بطريقة تانية.';
    S.hist.push({role:'model',parts:[{text:ans}]});
    let i=0;const step=Math.max(2,Math.ceil(ans.length/180));
    await new Promise(res=>{(function t(){i+=step;out.innerHTML=md(ans.slice(0,i));log.scrollTop=log.scrollHeight;i<ans.length?setTimeout(t,16):res()})()});
  }catch(e){out.innerHTML='⚠ '+esc(e.message);S.hist.pop()}
  S.busy=false;$('#send').disabled=false;inp.focus();
}

/* ===== بيانات ناسا الحية ===== */
const J=u=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()});
async function tool(k){
  try{
    if(k==='apod'){const d=await J('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY');
      const img=d.media_type==='image'?'<img class="card" src="'+d.url+'" alt="">':'';
      add('bot','<b>🔭 '+esc(d.title)+'</b> <small style="color:var(--mute)">'+d.date+'</small>'+img);
      return ask('اشرحلي صورة ناسا النهارده وإيه أهميتها',JSON.stringify({title:d.title,date:d.date,explanation:d.explanation}))}
    if(k==='epic'){const a=await J('https://epic.gsfc.nasa.gov/api/natural'),e=a[0],dt=e.date.slice(0,10).split('-');
      add('bot','<b>🌍 الأرض من نقطة لاغرانج L1</b><img class="card" src="https://epic.gsfc.nasa.gov/archive/natural/'+dt.join('/')+'/jpg/'+e.image+'.jpg" alt="">');
      return ask('إيه اللي بنشوفه في أحدث صورة للأرض من DSCOVR؟',JSON.stringify({date:e.date,caption:e.caption}))}
    if(k==='neo'){const d=await J('https://ssd-api.jpl.nasa.gov/cad.api?limit=5&dist-max=0.05&sort=date&date-min=now');
      return ask('في كويكبات قريبة من الأرض؟ لخّصلي الاقترابات الجاية وهل فيها خطر',JSON.stringify({fields:d.fields,data:d.data}))}
    if(k==='quake'){const d=await J('https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=5&minmagnitude=4.5&orderby=time');
      return ask('اتكلم عن آخر زلازل الأرض وقارنها بزلازل المريخ (InSight)',JSON.stringify(d.features.map(f=>({place:f.properties.place,mag:f.properties.mag,time:new Date(f.properties.time).toISOString(),depth_km:f.geometry.coordinates[2]}))))}
  }catch(_){add('bot','⚠ مقدرتش أجيب بيانات ناسا دلوقتي. جرّب تاني بعد شوية.')}
}
welcome();
</script>
</body>
</html>
