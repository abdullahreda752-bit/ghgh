<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كوكب المريخ: كرة تفاعلية ثلاثية الأبعاد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#050303;--panel:#120c09ee;--line:#3a2a22;--ink:#f1e3d6;--mute:#a58f80;--rust:#e0693a;--ice:#7fd8ff;--ok:#6fd38a;--warn:#f0b64a;--bad:#ef5350;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;overflow:hidden}
#app{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
h1{position:absolute;top:14px;inset-inline-start:18px;margin:0;font-size:clamp(18px,3vw,28px);font-weight:800;pointer-events:none;text-shadow:0 2px 12px #000}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--mute);direction:ltr;text-align:right}
#panel{position:absolute;top:14px;inset-inline-end:14px;width:300px;max-height:calc(100% - 28px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;backdrop-filter:blur(6px)}
.box h2{margin:0 0 7px;font-size:14px}
#layers{display:grid;grid-template-columns:1fr 1fr;gap:5px}
button{font:inherit;color:var(--ink);background:#1b120e;border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:5px 8px;font-size:13px}
button:hover{border-color:var(--rust)}button:focus-visible{outline:2px solid var(--ice)}
#layers button[aria-pressed=true]{background:var(--rust);border-color:var(--rust);color:#1a0d07;font-weight:700}
#legend{height:8px;border-radius:2px;margin-top:8px}.lg{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:2px}
.score{font-size:36px;font-weight:800;line-height:1}.verdict{font-weight:700;margin-bottom:6px}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13px}dt{color:var(--mute)}dd{margin:0;direction:ltr;text-align:end;font-family:ui-monospace,monospace}
.empty{color:var(--mute);font-size:13px;margin:0}
#sites{display:flex;flex-wrap:wrap;gap:5px}
#tools{position:absolute;bottom:14px;inset-inline-start:14px;display:flex;gap:6px}
#hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--mute);pointer-events:none;white-space:nowrap;text-shadow:0 1px 6px #000}
.lab{position:absolute;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 4px #000,0 0 8px #000;pointer-events:none;transform:translate(-50%,-165%);white-space:nowrap}
#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);font-size:18px;transition:opacity .6s}
@media(max-width:760px){#panel{top:auto;bottom:56px;inset-inline-end:8px;inset-inline-start:8px;width:auto;max-height:36%}#hint{display:none}h1 small{display:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="كرة المريخ ثلاثية الأبعاد"></canvas>
  <div id="labels"></div>
  <h1>دليل النجاة بين الكواكب<small>Interplanetary Survival Guide: Mars</small></h1>
  <div id="panel">
    <div class="box"><h2>طبقات الكوكب</h2><div id="layers"></div><div id="legend"></div><div class="lg"><span id="l0"></span><span id="l1"></span></div></div>
    <div class="box" id="scan"><h2>تقرير المسح</h2><p class="empty">اضغط على أي نقطة على الكرة.</p></div>
    <div class="box"><h2>مواقع الهبوط</h2><div id="sites"></div></div>
  </div>
  <div id="tools"><button id="auto" aria-pressed="true">دوران تلقائي</button><button id="zi">+</button><button id="zo">−</button></div>
  <div id="hint">اسحب للدوران · عجلة الماوس أو قرصة بالإصبعين للتقريب</div>
  <div id="load">جارٍ توليد سطح المريخ…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const W=1024,H=512,R2D=180/Math.PI,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const hash=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
const fbm=(x,y,o=5)=>{let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f);f*=2;a*=.5}return s};
const bump=(lo,la,cx,cy,sx,sy,a)=>a*Math.exp(-(((lo-cx)/sx)**2)-(((la-cy)/sy)**2));

// ---------- planet data (km / degC / % / score) ----------
const N=W*H,E=new Float32Array(N),SL=new Float32Array(N),T=new Float32Array(N),ICE=new Float32Array(N),RES=new Float32Array(N),SAF=new Float32Array(N);
const lonOf=i=>i/W*360-180,latOf=j=>90-j/H*180,K=720/W;
for(let j=0;j<H;j++)for(let i=0;i<W;i++){
  const lo=lonOf(i),la=latOf(j),a=i*K,b=j*K;
  let e=(fbm(a*.03,b*.03)-.5)*4+(fbm(a*.12,b*.12,4)-.5)*1.6-2.2*Math.tanh(la/20);
  e+=bump(lo,la,-134,18.6,6,5,19)+bump(lo,la,-105,0,28,20,5)+bump(lo,la,147,25,10,7,4)+bump(lo,la,70,-42,14,10,-9)+bump(lo,la,-43,-50,8,7,-3.5)+bump(lo,la,87,13,8,6,-3)+bump(lo,la,-60,-13,24,2.4,-6);
  E[j*W+i]=e;
}
for(let j=0;j<H;j++)for(let i=0;i<W;i++){
  const k=j*W+i,gx=E[j*W+Math.min(W-1,i+1)]-E[j*W+Math.max(0,i-1)],gy=E[Math.min(H-1,j+1)*W+i]-E[Math.max(0,j-1)*W+i];
  const sl=Math.min(40,Math.hypot(gx,gy)*12.8);SL[k]=sl;
  const la=latOf(j),al=Math.abs(la),e=E[k];
  T[k]=-125+105*Math.pow(Math.cos(la/R2D),.7)-2*e;
  ICE[k]=clamp(clamp((al-32)/30)*(.55+.45*fbm(i*K*.05+9,j*K*.05))*(e<3?1:.5)+(al>74?1:0));
  RES[k]=clamp(.6*ICE[k]+.25*(sl<6?1:0)+.25*fbm(i*K*.08+40,j*K*.08+7)+(e<-2&&e>-6?.1:0));
  SAF[k]=clamp((100-sl*2.4-Math.max(0,al-50)*1.1-Math.max(0,e-3)*5-Math.max(0,-e-5)*4+ICE[k]*8)/100)*100;
}
// ---------- colour ramps (LUT) ----------
const lut=st=>{const o=new Uint8Array(768);for(let n=0;n<256;n++){const t=n/255;let s=1;while(s<st.length-1&&t>st[s][0])s++;const a=st[s-1],b=st[s],u=clamp((t-a[0])/(b[0]-a[0]));for(let c=0;c<3;c++)o[n*3+c]=a[1][c]+(b[1][c]-a[1][c])*u}return o};
const TERR=[[0,[40,20,24]],[.3,[118,58,36]],[.45,[172,92,52]],[.6,[208,130,80]],[.8,[230,192,148]],[1,[252,244,236]]];
const LAYERS=[
 {id:'terrain',name:'سطح حقيقي',a:'منخفض',b:'مرتفع',g:TERR,v:null},
 {id:'ice',name:'الجليد والمياه',a:'جاف',b:'جليد كثيف',g:[[0,[20,30,40]],[1,[140,225,255]]],v:k=>ICE[k]},
 {id:'temp',name:'الحرارة',a:'−125°',b:'−20°',g:[[0,[60,70,200]],[.35,[140,90,200]],[.65,[235,120,70]],[1,[255,220,90]]],v:k=>(T[k]+125)/105},
 {id:'hazard',name:'مناطق الخطر',a:'مستوية',b:'منحدر حاد',g:[[0,[60,200,120]],[.5,[240,180,70]],[1,[230,50,50]]],v:k=>SL[k]/25},
 {id:'res',name:'الموارد',a:'فقيرة',b:'غنية',g:[[0,[40,30,20]],[1,[255,205,70]]],v:k=>RES[k]},
 {id:'safe',name:'أمان الهبوط',a:'خطر',b:'آمن',g:[[0,[220,60,55]],[.5,[240,180,70]],[1,[90,210,130]]],v:k=>SAF[k]/100}
];
LAYERS.forEach(L=>L.lut=lut(L.g));
const base=new Uint8ClampedArray(N*3),TL=LAYERS[0].lut;
for(let j=0;j<H;j++)for(let i=0;i<W;i++){const k=j*W+i,n=Math.round(clamp((E[k]+9)/32+.05)*255);
  const dx=E[j*W+Math.max(0,i-1)]-E[j*W+Math.min(W-1,i+1)],dy=E[Math.max(0,j-1)*W+i]-E[Math.min(H-1,j+1)*W+i],sh=clamp(1+.12*(dx+dy),.75,1.25);
  for(let q=0;q<3;q++)base[k*3+q]=TL[n*3+q]*sh}
function mkTex(fn){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),im=x.createImageData(W,H);fn(im.data);x.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
const cache={};
function layerTex(L){return cache[L.id]||(cache[L.id]=mkTex(d=>{for(let k=0;k<N;k++){let r=base[k*3],g=base[k*3+1],b=base[k*3+2];
  if(L.v){const n=Math.round(clamp(L.v(k))*255),a=.8;r=L.lut[n*3]*a+r*(1-a)*.55;g=L.lut[n*3+1]*a+g*(1-a)*.55;b=L.lut[n*3+2]*a+b*(1-a)*.55}
  d[k*4]=r;d[k*4+1]=g;d[k*4+2]=b;d[k*4+3]=255}}))}
const bumpTex=(()=>{const t=mkTex(d=>{for(let k=0;k<N;k++){const v=clamp((E[k]+9)/32)*255;d[k*4]=d[k*4+1]=d[k*4+2]=v;d[k*4+3]=255}});t.encoding=THREE.LinearEncoding;return t})();

// ---------- scene ----------
const cvs=document.getElementById('gl'),ren=new THREE.WebGLRenderer({canvas:cvs,antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.01,200);
let D=3.4,Dt=3.4;cam.position.z=D;
const sun=new THREE.DirectionalLight(0xfff0e0,1.7);sun.position.set(5,2,6);scene.add(sun,new THREE.AmbientLight(0xffc8a8,.4));
const G=new THREE.Group();G.rotation.order='XYZ';scene.add(G);
const mat=new THREE.MeshStandardMaterial({map:layerTex(LAYERS[0]),bumpMap:bumpTex,bumpScale:2.2,roughness:1,metalness:0});
const globe=new THREE.Mesh(new THREE.SphereGeometry(1,128,64),mat);G.add(globe);
const atm=new THREE.Mesh(new THREE.SphereGeometry(1.045,64,32),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false,
 vertexShader:'varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 n;void main(){float i=pow(.68-dot(n,vec3(0,0,1.)),3.);gl_FragColor=vec4(.95,.55,.4,1.)*i*1.5;}'}));scene.add(atm);
const stars=(()=>{const p=[];for(let i=0;i<1800;i++){const u=Math.random()*2-1,t=Math.random()*6.283,r=Math.sqrt(1-u*u);p.push(60*r*Math.cos(t),60*u,60*r*Math.sin(t))}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));return new THREE.Points(g,new THREE.PointsMaterial({size:.18,color:0xffffff,sizeAttenuation:true}))})();scene.add(stars);
const moons=[['Phobos',.02,1.9,.9,0x8a7f78],['Deimos',.013,2.7,.35,0xa59a90]].map(m=>{const o=new THREE.Mesh(new THREE.SphereGeometry(m[1],16,12),new THREE.MeshStandardMaterial({color:m[4],roughness:1}));scene.add(o);return{o,r:m[2],s:m[3],p:Math.random()*6}});

// ---------- geo helpers ----------
const V=(la,lo,r=1)=>{const p=(lo+180)/R2D,t=(90-la)/R2D;return new THREE.Vector3(-r*Math.cos(p)*Math.sin(t),r*Math.cos(t),r*Math.sin(p)*Math.sin(t))};
const SITES=[['Viking 1',22.5,-48],['Viking 2',48,134],['Pathfinder',19.1,-33],['Spirit',-14.6,175.5],['Opportunity',-2,-5.5],['Curiosity',-4.6,137.4],['Phoenix',68.2,-125.7],['InSight',4.5,135.6],['Zhurong',25.1,109.9],['Perseverance',18.4,77.5]];
const FEAT=[['أوليمبوس مونس',18.6,-134],['وادي مارينيريس',-13,-60],['حوض هيلاس',-42,70]];
const labs=document.getElementById('labels'),pins=[];
function addPin(n,la,lo,col,big){const m=new THREE.Mesh(new THREE.SphereGeometry(big?.011:.008,12,8),new THREE.MeshBasicMaterial({color:col}));m.position.copy(V(la,lo,1.004));G.add(m);
  const d=document.createElement('div');d.className='lab';d.textContent=n;d.style.opacity=0;labs.appendChild(d);pins.push({m,d,big})}
SITES.forEach(s=>addPin(s[0],s[1],s[2],0x7fd8ff));FEAT.forEach(s=>addPin(s[0],s[1],s[2],0xffffff,true));
const selPin=new THREE.Mesh(new THREE.RingGeometry(.014,.019,24),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));selPin.visible=false;G.add(selPin);

// ---------- UI ----------
let cur=LAYERS[0],sel=null;
const css=g=>'linear-gradient(90deg,'+g.map(s=>`rgb(${s[1]}) ${s[0]*100}%`).join(',')+')',$=id=>document.getElementById(id);
function setLayer(L){cur=L;mat.map=layerTex(L);mat.needsUpdate=true;[...$('layers').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===L.id));
  $('legend').style.background=css(L.g);$('l0').textContent=L.a;$('l1').textContent=L.b}
LAYERS.forEach(L=>{const b=document.createElement('button');b.textContent=L.name;b.dataset.id=L.id;b.onclick=()=>setLayer(L);$('layers').appendChild(b)});
function scan(la,lo){
  const i=clamp(Math.floor((lo+180)/360*W),0,W-1),j=clamp(Math.floor((90-la)/180*H),0,H-1),k=j*W+i,sc=Math.round(SAF[k]);
  const col=sc>=70?'var(--ok)':sc>=45?'var(--warn)':'var(--bad)',vt=sc>=70?'منطقة آمنة للهبوط':sc>=45?'مقبولة بحذر':'منطقة خطرة، تجنّبها';
  const ice=ICE[k]>.55?'جليد قريب من السطح':ICE[k]>.25?'احتمال جليد تحت التربة':'لا جليد ظاهر',sg=v=>(v>=0?'+':'')+v.toFixed(1);
  $('scan').innerHTML=`<h2>تقرير المسح</h2><div class="score" style="color:${col}">${sc}<span style="font-size:14px;color:var(--mute)"> / 100</span></div><div class="verdict" style="color:${col}">${vt}</div>
  <dl><dt>الإحداثيات</dt><dd>${Math.abs(la).toFixed(1)}°${la>=0?'N':'S'} ${Math.abs(lo).toFixed(1)}°${lo>=0?'E':'W'}</dd><dt>الارتفاع</dt><dd>${sg(E[k])} km</dd><dt>الحرارة</dt><dd>${T[k].toFixed(0)} °C</dd><dt>الانحدار</dt><dd>${SL[k].toFixed(1)}°</dd><dt>الجليد</dt><dd>${Math.round(ICE[k]*100)}%</dd><dt>الموارد</dt><dd>${Math.round(RES[k]*100)}%</dd></dl>
  <p class="empty" style="margin-top:6px">${ice}${SL[k]>14?'، وانحدار حاد':''}${T[k]<-90?'، وبرد شديد':''}.</p>`;
  selPin.visible=true;selPin.position.copy(V(la,lo,1.006));selPin.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),selPin.position.clone().normalize());
}
// ---------- controls ----------
let vx=0,vy=0,auto=true,flyTo=null;const ptr=new Map();let down=null,pinch=0;
const Dmin=1.14,Dmax=7;
cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});down={x:e.clientX,y:e.clientY,m:0};flyTo=null;vx=vy=0;if(ptr.size==2){const [a,b]=[...ptr.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
cvs.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptr.size==2){const [a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);Dt=clamp(Dt*pinch/d,Dmin,Dmax);pinch=d;if(down)down.m=99;return}
  if(down)down.m=Math.max(down.m,Math.hypot(e.clientX-down.x,e.clientY-down.y));
  if(down&&down.m>4){const k=.0042*(D-.9)/2.5;vy=dx*k;vx=dy*k;G.rotation.y+=vy;G.rotation.x=clamp(G.rotation.x+vx,-1.45,1.45)}});
cvs.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);if(down&&down.m<=4&&ptr.size==0){const r=cvs.getBoundingClientRect(),rc=new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),cam);const h=rc.intersectObject(globe)[0];
  if(h){const p=globe.worldToLocal(h.point.clone()).normalize(),la=Math.asin(p.y)*R2D;let lo=Math.atan2(p.z,-p.x)*R2D-180;if(lo<-180)lo+=360;scan(la,lo)}}
  if(ptr.size==0)down=null});
cvs.addEventListener('wheel',e=>{e.preventDefault();Dt=clamp(Dt*(e.deltaY>0?1.12:.89),Dmin,Dmax)},{passive:false});
$('zi').onclick=()=>Dt=clamp(Dt*.7,Dmin,Dmax);$('zo').onclick=()=>Dt=clamp(Dt/.7,Dmin,Dmax);
$('auto').onclick=e=>{auto=!auto;e.target.setAttribute('aria-pressed',auto)};
SITES.forEach(s=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>{const v=V(s[1],s[2]);let ry=Math.atan2(-v.x,v.z);const c=G.rotation.y;ry=c+Math.atan2(Math.sin(ry-c),Math.cos(ry-c));
  flyTo={ry,rx:s[1]/R2D};Dt=1.6;auto=false;$('auto').setAttribute('aria-pressed',false);scan(s[1],s[2])};$('sites').appendChild(b)});
function resize(){const w=cvs.clientWidth,h=cvs.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);
// ---------- loop ----------
const tmp=new THREE.Vector3();let t0=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-t0)/1000);t0=now;
  D+=(Dt-D)*.12;cam.position.z=D;
  if(flyTo){G.rotation.y+=(flyTo.ry-G.rotation.y)*.08;G.rotation.x+=(flyTo.rx-G.rotation.x)*.08}
  else if(!down){G.rotation.y+=vy;G.rotation.x=clamp(G.rotation.x+vx,-1.45,1.45);vx*=.94;vy*=.94;if(auto)G.rotation.y+=dt*.06*Math.min(1,(D-1)/1.5)}
  moons.forEach(m=>{m.p+=dt*m.s;m.o.position.set(Math.cos(m.p)*m.r,Math.sin(m.p)*m.r*.25,Math.sin(m.p)*m.r)});
  stars.rotation.y+=dt*.002;
  const cd=cam.position.clone().normalize();
  pins.forEach(p=>{p.m.getWorldPosition(tmp);const vis=tmp.clone().normalize().dot(cd)>1/D+.06&&(p.big?D<4.5:D<2.4);
    if(vis){const s=tmp.clone().project(cam),r=cvs.getBoundingClientRect();p.d.style.left=((s.x+1)/2*r.width)+'px';p.d.style.top=((1-s.y)/2*r.height)+'px';p.d.style.opacity=1}else p.d.style.opacity=0;
    p.m.scale.setScalar(Math.max(.6,Math.min(2.5,(D-1)/1.5)))});
  ren.render(scene,cam)}
setLayer(LAYERS[0]);resize();requestAnimationFrame(frame);
$('load').style.opacity=0;setTimeout(()=>$('load').remove(),700);
</script>
</body>
</html>
